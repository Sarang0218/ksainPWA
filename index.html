<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="/">
  <!--
    The "flutter bootstrap" javascript loads the user's flutter app. This script
    is defined in web/_flutter_bootstrap.js.  
  -->
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
  <meta name="description" content="한국과학영재학교 가온누리 모바일 버전 (미리보기)">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ksain">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Android meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1976d2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <title>한국과학영재학교 가온누리 모바일 버전 (미리보기)</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = ""795430316"";
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-messaging-compat.js"></script>

  <style>
    /* Loading screen styles */
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1976d2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    
    .loading-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
    }
    
    .loading-text {
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    .loading-subtitle {
      color: rgba(255, 255, 255, 0.8);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      margin-bottom: 30px;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Hide loading screen when Flutter loads */
    body.flutter-loaded .loading-container {
      display: none;
    }

    /* PWA Install Button */
    .install-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(25, 118, 210, 0.3);
      display: none;
      z-index: 1000;
    }

    .install-button:hover {
      background: #1565c0;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(25, 118, 210, 0.4);
    }

    /* Full viewport PWA styles - AGGRESSIVE approach */
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
    }
    
    html {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      position: fixed !important;
      overflow: hidden !important;
    }
    
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      overflow: hidden !important;
      -webkit-overflow-scrolling: touch !important;
      overscroll-behavior: none !important;
    }

    /* PWA standalone mode - extend into all safe areas */
    @media all and (display-mode: standalone) {
      html {
        /* Use negative positioning to extend beyond safe area */
        padding-top: 0 !important;
        margin-top: calc(-1 * env(safe-area-inset-top, 0px)) !important;
      }
      
      body {
        /* Force content to start from absolute top */
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px) !important;
        padding-top: 0 !important;
        margin-top: calc(-1 * env(safe-area-inset-top, 0px)) !important;
        height: calc(100vh + env(safe-area-inset-top, 0px)) !important;
        transform: translateY(calc(-1 * env(safe-area-inset-top, 0px))) !important;
      }
    }

    /* Flutter canvas positioning */
    flt-glass-pane {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
      transform: none !important;
    }
    
    /* iOS specific overrides */
    @supports (-webkit-touch-callout: none) {
      @media all and (display-mode: standalone) {
        body {
          /* iOS needs special handling */
          position: fixed !important;
          top: calc(-1 * env(safe-area-inset-top, 0px)) !important;
          padding-top: env(safe-area-inset-top, 0px) !important;
          height: calc(100vh + env(safe-area-inset-top, 0px)) !important;
        }
        
        flt-glass-pane {
          /* Push Flutter content up */
          position: fixed !important;
          top: calc(-1 * env(safe-area-inset-top, 0px)) !important;
          height: calc(100vh + env(safe-area-inset-top, 0px)) !important;
          padding-top: env(safe-area-inset-top, 0px) !important;
        }
      }
    }
    
    /* Force all Flutter content containers */
    flt-glass-pane > *, 
    flt-scene-host,
    flt-scene,
    flt-semantics-placeholder {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div class="loading-container">
    <img src="icons/Icon-192.png" alt="ksain Logo" class="loading-logo">
    <div class="loading-text">가온누리</div>
    <div class="loading-subtitle">한국과학영재학교 모바일 버전 (미리보기)</div>
    <div class="loading-spinner"></div>
  </div>

  <!-- PWA Install Button -->
  <button id="install-button" class="install-button">
    📱 앱으로 설치하기
  </button>

  <script>
    // PWA Install functionality
    let deferredPrompt;
    const installButton = document.getElementById('install-button');

    window.addEventListener('beforeinstallprompt', (e) => {
      console.log('PWA install prompt triggered');
      e.preventDefault();
      deferredPrompt = e;
      installButton.style.display = 'block';
    });

    installButton.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`PWA install outcome: ${outcome}`);
        deferredPrompt = null;
        installButton.style.display = 'none';
      }
    });

    window.addEventListener('appinstalled', (e) => {
      console.log('PWA installed successfully');
      installButton.style.display = 'none';
    });

    // Firebase is initialized by Flutter app, not here
    // This prevents duplicate initialization and duplicate notifications
    console.log('Firebase will be initialized by Flutter app');

    // Service Worker Registration  
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js')
        .then((registration) => {
          console.log('Service Worker registered:', registration);
        })
        .catch((error) => {
          console.log('Service Worker registration failed (not critical):', error);
        });
    }

    // Ensure Flutter app loads even if Firebase fails
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.body.classList.add('flutter-loaded');
      }, 3000); // Force show app after 3 seconds
    });

    // Debug Flutter loading
    window.addEventListener('flutter-first-frame', () => {
      console.log('Flutter first frame rendered');
      document.body.classList.add('flutter-loaded');
      
      // Force iOS PWA to use full screen
      if (window.navigator.standalone === true) {
        console.log('Running in iOS PWA mode - forcing full screen');
        
        // Find Flutter container and force it to top
        const flutterContainer = document.querySelector('flt-glass-pane');
        if (flutterContainer) {
          // Get safe area inset
          const styles = getComputedStyle(document.documentElement);
          const safeAreaTop = styles.getPropertyValue('env(safe-area-inset-top)') || '0px';
          console.log('Safe area top:', safeAreaTop);
          
          // Override positioning with inline styles (highest priority)
          flutterContainer.style.cssText = `
            position: fixed !important;
            top: 0px !important;
            left: 0px !important;
            right: 0px !important;
            bottom: 0px !important;
            width: 100% !important;
            height: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            transform: translateY(-${safeAreaTop}) !important;
          `;
          
          // Also adjust body
          document.body.style.cssText = `
            position: fixed !important;
            top: -${safeAreaTop} !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100% !important;
            height: calc(100vh + ${safeAreaTop}) !important;
            padding: 0 !important;
            margin: 0 !important;
          `;
        }
      }
    });

    // Add error logging
    window.addEventListener('error', (e) => {
      console.error('JavaScript error:', e.error);
    });

    // Check Flutter engine initialization
    window.addEventListener('load', () => {
      console.log('Window loaded, checking Flutter...');
      setTimeout(() => {
        if (!window._flutter) {
          console.error('Flutter engine not initialized after 3 seconds');
        }
        document.body.classList.add('flutter-loaded');
      }, 3000);
    });

    // Final fallback
    setTimeout(() => {
      console.log('Final fallback: removing loading screen');
      document.body.classList.add('flutter-loaded');
    }, 5000);
    
    // iOS PWA Full Screen Helper with MutationObserver
    function forceIOSFullScreen() {
      if (window.navigator.standalone !== true) return;
      
      const applyFullScreenStyles = () => {
        const flutterContainer = document.querySelector('flt-glass-pane');
        if (flutterContainer && !flutterContainer.dataset.fullscreenApplied) {
          flutterContainer.dataset.fullscreenApplied = 'true';
          flutterContainer.style.setProperty('position', 'fixed', 'important');
          flutterContainer.style.setProperty('top', '0', 'important');
          flutterContainer.style.setProperty('left', '0', 'important');
          flutterContainer.style.setProperty('right', '0', 'important');
          flutterContainer.style.setProperty('bottom', '0', 'important');
          flutterContainer.style.setProperty('transform', 'translateY(-20px)', 'important'); // 20px is typical iOS status bar
          flutterContainer.style.setProperty('height', 'calc(100vh + 20px)', 'important');
        }
      };
      
      // Apply immediately if possible
      applyFullScreenStyles();
      
      // Watch for Flutter container creation
      const observer = new MutationObserver((mutations) => {
        applyFullScreenStyles();
      });
      
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
      
      // Apply styles periodically as fallback
      setInterval(applyFullScreenStyles, 1000);
    }
    
    // Initialize iOS full screen on load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', forceIOSFullScreen);
    } else {
      forceIOSFullScreen();
    }
  </script>
</body>
</html>
