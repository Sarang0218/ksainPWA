<!DOCTYPE html>
<html>
<head>
    <title>FCM Notification Test</title>
    <meta charset="utf-8">
    <style>
        body { font-family: monospace; padding: 20px; max-width: 800px; margin: 0 auto; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4f4dd; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .log-entry { padding: 5px; margin: 2px 0; background: #f5f5f5; font-size: 12px; }
    </style>
</head>
<body>
    <h1>🔔 FCM Notification Test Page</h1>
    
    <div id="permission-status" class="status info">Checking permission status...</div>
    <div id="token-status" class="status info">Checking FCM token...</div>
    <div id="sw-status" class="status info">Checking service worker...</div>
    
    <div style="margin: 20px 0;">
        <button onclick="requestPermission()">Request Permission</button>
        <button onclick="getToken()">Get FCM Token</button>
        <button onclick="sendTestNotification()">Send Test Notification</button>
        <button onclick="sendLocalNotification()">Test Local Notification</button>
    </div>
    
    <h3>Log:</h3>
    <div id="log" style="height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px;"></div>

    <script type="module">
        // Import Firebase
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js';
        import { getMessaging, getToken, onMessage } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-messaging.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyByXVeGaHRyIUSnnAbvRYSCIgU60aON5mU",
            authDomain: "ksain-gaonuri.firebaseapp.com",
            projectId: "ksain-gaonuri",
            storageBucket: "ksain-gaonuri.firebasestorage.app",
            messagingSenderId: "1070324804834",
            appId: "1:1070324804834:web:884d0fe2a5b4300fca42bb",
            measurementId: "G-GCGNRRHCV7"
        };
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app);
        
        // Make functions global
        window.messaging = messaging;
        window.getTokenFunc = getToken;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            entry.style.color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'black';
            logDiv.insertBefore(entry, logDiv.firstChild);
            console.log(message);
        }
        
        // Check notification permission
        function checkPermission() {
            const permission = Notification.permission;
            const statusDiv = document.getElementById('permission-status');
            
            if (permission === 'granted') {
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ Notification permission granted';
                log('Permission granted', 'success');
            } else if (permission === 'denied') {
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ Notification permission denied - please enable in browser settings';
                log('Permission denied', 'error');
            } else {
                statusDiv.className = 'status info';
                statusDiv.textContent = '⚠️ Notification permission not yet requested';
                log('Permission not yet requested');
            }
        }
        
        // Request permission
        window.requestPermission = async function() {
            try {
                const permission = await Notification.requestPermission();
                checkPermission();
                if (permission === 'granted') {
                    await getToken();
                }
            } catch (error) {
                log('Error requesting permission: ' + error.message, 'error');
            }
        }
        
        // Get FCM token
        window.getToken = async function() {
            try {
                log('Getting FCM token...');
                const currentToken = await getToken(messaging, {
                    vapidKey: 'BJVEkNU3cuWzypgfL4Er8azPHHdjoPBQwARtWU9dkswQ0sTkaTO0FB2FJHmpmNAN5eIDl_Y8-neAWMyA9W_q_ZI'
                });
                
                if (currentToken) {
                    const tokenDiv = document.getElementById('token-status');
                    tokenDiv.className = 'status success';
                    tokenDiv.textContent = '✅ FCM Token: ' + currentToken.substring(0, 30) + '...';
                    log('FCM Token received: ' + currentToken, 'success');
                    
                    // Register with server
                    await registerToken(currentToken);
                } else {
                    log('No registration token available', 'error');
                }
            } catch (error) {
                log('Error getting token: ' + error.message, 'error');
            }
        }
        
        // Register token with server
        async function registerToken(token) {
            try {
                log('Registering token with server...');
                const sessionId = '52ad3ecff4e8933acedfbb3d7320a1cf7dbf4ca9231a89945b4411ddcdf478ce';
                
                const response = await fetch('https://api.ksain.net/v1/mobile/register_fcm_token.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'sessionID': sessionId
                    },
                    body: new URLSearchParams({
                        'fcm_token': token,
                        'sessionId': sessionId
                    })
                });
                
                const data = await response.json();
                if (response.ok) {
                    log('Token registered successfully', 'success');
                } else {
                    log('Token registration failed: ' + JSON.stringify(data), 'error');
                }
            } catch (error) {
                log('Error registering token: ' + error.message, 'error');
            }
        }
        
        // Send test notification via API
        window.sendTestNotification = async function() {
            try {
                log('Sending test notification...');
                const sessionId = '52ad3ecff4e8933acedfbb3d7320a1cf7dbf4ca9231a89945b4411ddcdf478ce';
                
                const response = await fetch('https://api.ksain.net/v1/mobile/send_test_notification.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'sessionID': sessionId
                    },
                    body: new URLSearchParams({
                        'title': '🔔 Test Notification',
                        'body': 'Test at ' + new Date().toLocaleTimeString(),
                        'type': 'test'
                    })
                });
                
                const data = await response.json();
                if (response.ok) {
                    log('Notification sent successfully: ' + JSON.stringify(data), 'success');
                    log('⚠️ Note: Switch to another tab to see background notifications', 'info');
                } else {
                    log('Failed to send notification: ' + JSON.stringify(data), 'error');
                }
            } catch (error) {
                log('Error sending notification: ' + error.message, 'error');
            }
        }
        
        // Test local notification
        window.sendLocalNotification = function() {
            if (Notification.permission === 'granted') {
                const notification = new Notification('Local Test Notification', {
                    body: 'This is a local browser notification at ' + new Date().toLocaleTimeString(),
                    icon: '/icons/Icon-192.png',
                    badge: '/icons/badge-72x72.png'
                });
                log('Local notification sent', 'success');
            } else {
                log('Permission not granted for notifications', 'error');
            }
        }
        
        // Check service worker
        async function checkServiceWorker() {
            const swDiv = document.getElementById('sw-status');
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
                    swDiv.className = 'status success';
                    swDiv.textContent = '✅ Service Worker registered';
                    log('Service Worker registered', 'success');
                } catch (error) {
                    swDiv.className = 'status error';
                    swDiv.textContent = '❌ Service Worker registration failed';
                    log('Service Worker error: ' + error.message, 'error');
                }
            } else {
                swDiv.className = 'status error';
                swDiv.textContent = '❌ Service Workers not supported';
                log('Service Workers not supported', 'error');
            }
        }
        
        // Listen for foreground messages
        onMessage(messaging, (payload) => {
            log('Foreground message received: ' + JSON.stringify(payload), 'success');
            
            // Show notification even in foreground
            if (Notification.permission === 'granted') {
                new Notification(payload.notification.title, {
                    body: payload.notification.body,
                    icon: '/icons/Icon-192.png',
                    data: payload.data
                });
            }
        });
        
        // Initialize on load
        checkPermission();
        checkServiceWorker();
        
        // Auto-get token if permission already granted
        if (Notification.permission === 'granted') {
            getToken();
        }
    </script>
</body>
</html>
