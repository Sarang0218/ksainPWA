<!DOCTYPE html>
<html>
<head>
    <title>FCM Test</title>
    <meta charset="utf-8">
    <style>
        body { font-family: monospace; padding: 20px; }
        .log { margin: 10px 0; padding: 10px; background: #f0f0f0; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
        .success { background: #d4f4dd; }
        .error { background: #fdd; }
    </style>
</head>
<body>
    <h1>FCM Token Registration Test</h1>
    <div id="status"></div>
    <button onclick="testRegistration()">Test FCM Registration</button>
    <button onclick="checkTokens()">Check Database Tokens</button>
    <div id="logs"></div>

    <script>
        const sessionId = '52ad3ecff4e8933acedfbb3d7320a1cf7dbf4ca9231a89945b4411ddcdf478ce';
        
        function log(message, isError = false) {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = 'log' + (isError ? ' error' : '');
            div.textContent = new Date().toISOString() + ': ' + message;
            logs.insertBefore(div, logs.firstChild);
        }

        async function testRegistration() {
            try {
                const testToken = 'web_test_token_' + Date.now();
                log('Testing with token: ' + testToken);
                
                const formData = new URLSearchParams();
                formData.append('fcm_token', testToken);
                formData.append('sessionId', sessionId);
                
                const response = await fetch('https://api.ksain.net/v1/mobile/register_fcm_token.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'sessionID': sessionId
                    },
                    body: formData.toString()
                });

                const data = await response.json();
                log('Response: ' + JSON.stringify(data, null, 2), response.status !== 200);
                
                if (response.status === 200) {
                    log('✅ Token registered successfully!', false);
                    setTimeout(checkTokens, 1000);
                }
            } catch (error) {
                log('Error: ' + error.message, true);
            }
        }

        async function checkTokens() {
            try {
                const response = await fetch('https://api.ksain.net/v1/mobile/debug_fcm_tokens.php');
                const data = await response.json();
                log('Database tokens: ' + JSON.stringify(data, null, 2));
                
                if (data.total_tokens > 0) {
                    log('✅ Found ' + data.total_tokens + ' tokens in database', false);
                } else {
                    log('⚠️ No tokens found in database', true);
                }
            } catch (error) {
                log('Error checking tokens: ' + error.message, true);
            }
        }

        // Check tokens on load
        window.addEventListener('load', checkTokens);
    </script>
</body>
</html>
